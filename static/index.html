<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f8fb" />
  <meta name="description" content="Scribe: a calm workspace for writing and sharing documents." />
  <title>Scribe — Your space to think</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="Workspace navigation">
    <a class="brand" href="/" id="brand-link" aria-label="Scribe home">
      <span class="brand-logo" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M6 4h12l4 4v16H6z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M18 4v5h5M10 14h8M10 18h6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span>
      <span>Scribe<span class="brand-dot">.</span></span>
    </a>
    <div class="sidebar-section">
      <div class="sidebar-overline">WORKSPACE</div>
      <button id="new-document" class="btn btn-primary new-doc"><span aria-hidden="true">＋</span> New document</button>
      <button id="import-document" class="btn btn-ghost import-doc"><span id="upload-glyph" aria-hidden="true">⇧</span> Import file <span class="sidebar-key">.txt / .md</span></button>
      <input id="file-input" type="file" accept=".txt,.md,text/plain,text/markdown" hidden />
    </div>
    <div class="sidebar-section nav-section">
      <div class="sidebar-overline">LIBRARY</div>
      <button class="nav-item active" data-nav="all"><span class="nav-icon">▤</span> All documents <span class="nav-count" id="count-all">0</span></button>
      <button class="nav-item" data-nav="owned"><span class="nav-icon">▣</span> Owned by me <span class="nav-count" id="count-owned">0</span></button>
      <button class="nav-item" data-nav="shared"><span class="nav-icon">♧</span> Shared with me <span class="nav-count" id="count-shared">0</span></button>
    </div>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-bottom">
      <div class="help-card"><div class="help-icon">✦</div><strong>A little more room to think.</strong><p>Write freely. Everything saves automatically.</p></div>
      <div class="sidebar-footnote">SCRIBE WORKSPACE <span>·</span> DEMO</div>
    </div>
  </aside>
  <div class="right-side">
    <header class="topbar">
      <div class="breadcrumb" id="breadcrumb"><span>Workspace</span><span class="breadcrumb-slash">/</span><strong>All documents</strong></div>
      <div class="topbar-right">
        <span class="demo-pill"><span class="pulse-dot"></span> Live demo</span>
        <label class="account-label" for="account-switch">Viewing as</label>
        <div class="account-select-wrap"><span class="avatar" id="account-avatar">MC</span><select id="account-switch" aria-label="Switch demo account"><option value="maya">Maya Chen</option><option value="noah">Noah Patel</option></select><span class="chevron">⌄</span></div>
      </div>
    </header>
    <main class="main-area" id="main" aria-live="polite"><div class="loading">Opening your workspace…</div></main>
  </div>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script src="/static/app.js" defer></script>
</body>
</html>
